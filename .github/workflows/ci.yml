name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fulfillment
          POSTGRES_PASSWORD: fulfillment
          POSTGRES_DB: fulfillment_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fulfillment -d fulfillment_ops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fulfillment:fulfillment@localhost:5432/fulfillment_ops_test
      TEST_DATABASE_URL: postgresql://fulfillment:fulfillment@localhost:5432/fulfillment_ops_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate --workspace apps/api
        env:
          DATABASE_URL: postgresql://fulfillment:fulfillment@localhost:5432/fulfillment_ops_test

      - name: Type-check api
        run: npm run lint --workspace apps/api

      - name: Run api tests
        run: npm run test:api

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test:web

      - name: Build web
        run: npm run build:web
